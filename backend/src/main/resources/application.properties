spring.application.name=ResolveIT

spring.datasource.url=jdbc:postgresql://localhost:5432/ResolveIT
spring.datasource.username=postgres
spring.datasource.password=${POSTGRE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update

# O primeiro administrador é opcional e não possui credenciais padrão.
resolveit.admin.email=${RESOLVEIT_ADMIN_EMAIL:}
resolveit.admin.password=${RESOLVEIT_ADMIN_PASSWORD:}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Ative com HTTPS em produção.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
